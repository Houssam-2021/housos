---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  # ISO-only changes rebuild the ISO from the current image
  push:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-disk.yml'
  # Rebuild the ISO after an image build caused by a push (not the daily scheduled ones)
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: "houssamos" # replaced per image by the matrix below
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }} ${{ matrix.disk-type }}
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # amd64 unless arm64 is picked by hand (push-triggered runs have no inputs).
    # 24.04: the release the template's disk build was made for.
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["houssamos", "houssamos-nvidia"]   # images from build.yml
        disk-type: ["anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image }}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${{ matrix.disk-type }}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs bootc-image-builder directly (the bootc-image-builder-action is deprecated).
      # Job logs need a signed-in owner to read, so failures are also copied into a
      # public annotation and the run summary.
      - name: Build disk images
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          CONFIG="disk_config/disk.toml"
          if [ "${DISK_TYPE}" = "anaconda-iso" ]; then
            # The installed system follows this image for updates
            sed "s#ghcr.io/houssam-2021/houssamos:latest#${IMAGE}#" disk_config/iso.toml > iso-config.toml
            grep -F "${IMAGE}" iso-config.toml
            CONFIG="iso-config.toml"
          fi
          mkdir -p output

          # Same podman storage reset the bootc-image-builder-action did on GitHub runners
          # (https://github.com/osbuild/bootc-image-builder/issues/446)
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null

          # Ubuntu's AppArmor blocks unprivileged user namespaces, which osbuild's sandbox
          # needs to mount /dev into the image tree
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          sudo podman pull "${IMAGE}" 2>&1 | tail -n 3

          set +e
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v "$(pwd)/${CONFIG}:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type "${DISK_TYPE}" \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE}" 2>&1 | tee bib.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -ne 0 ]; then
            sudo dmesg | grep -i -E 'apparmor|denied|mount' | tail -n 15 > kernel.log || true
            {
              echo '### bootc-image-builder failed'
              echo '```'
              tail -n 80 bib.log
              echo '```'
              echo '### Kernel messages'
              echo '```'
              cat kernel.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            msg=$(tail -n 40 bib.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=bootc-image-builder failed::${msg}"
            kmsg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' kernel.log | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=kernel messages::${kmsg:-none}"
            exit "${status}"
          fi

          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f -exec ls -lh {} \;
          echo "output-directory=$(pwd)/output" >> "${GITHUB_OUTPUT}"

      # bootc-image-builder installs Fedora's installer artwork and has no option to change it,
      # so swap the pictures inside the ISO's installer image afterwards. If this step fails,
      # the unbranded ISO from the step above is uploaded instead.
      - name: Brand the installer
        id: brand
        if: matrix.disk-type == 'anaconda-iso'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools isomd5sum > /dev/null
          ISO=$(find output -name '*.iso' | head -n 1)
          WORK=$(mktemp -d)

          xorriso -osirrox on -indev "${ISO}" -extract /images/install.img "${WORK}/install.img" 2> /dev/null
          info=$(unsquashfs -s "${WORK}/install.img")
          comp=$(awk '/^Compression/ { print $2 }' <<< "${info}")
          block=$(awk '/^Block size/ { print $3 }' <<< "${info}")
          sudo unsquashfs -q -d "${WORK}/root" "${WORK}/install.img"

          # Older images keep the installer root in an ext4 file inside the squashfs
          target="${WORK}/root"
          if [ -f "${WORK}/root/LiveOS/rootfs.img" ]; then
            sudo mkdir -p "${WORK}/mnt"
            sudo mount -o loop "${WORK}/root/LiveOS/rootfs.img" "${WORK}/mnt"
            target="${WORK}/mnt"
          fi
          pixmaps="${target}/usr/share/anaconda/pixmaps"
          echo "### Installer pictures before branding" >> "${GITHUB_STEP_SUMMARY}"
          ls "${pixmaps}" | sed 's/^/- /' >> "${GITHUB_STEP_SUMMARY}"
          for art in disk_config/installer/*.png disk_config/installer/*.jpg; do
            sudo install -m 644 "${art}" "${pixmaps}/$(basename "${art}")"
          done
          # The HoussamOS look (purple backdrop, glass panel) goes at the end of the installer's own
          # stylesheet and of the product stylesheet its profiles name (Fedora's, loaded after it),
          # so its rules win over both
          sheets="/usr/share/anaconda/anaconda-gtk.css $({ grep -rhoP '^\s*custom_stylesheet\s*=\s*\K\S+' \
            "${target}/etc/anaconda" 2> /dev/null || true; } | sort -u | tr '\n' ' ')"
          echo "### Installer stylesheets branded" >> "${GITHUB_STEP_SUMMARY}"
          for sheet in ${sheets}; do
            if [ -f "${target}${sheet}" ]; then
              sudo tee -a "${target}${sheet}" < disk_config/installer/houssamos.css > /dev/null
              echo "- ${sheet}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          if [ "${target}" != "${WORK}/root" ]; then sudo umount "${WORK}/mnt"; fi

          sudo mksquashfs "${WORK}/root" "${WORK}/install.new" -comp "${comp:-xz}" -b "${block:-131072}" \
            -noappend -no-progress -quiet
          xorriso -indev "${ISO}" -outdev "${WORK}/branded.iso" -boot_image any replay \
            -map "${WORK}/install.new" /images/install.img 2>&1 | tail -n 5
          implantisomd5 --force "${WORK}/branded.iso" > /dev/null

          # Check the new ISO: same volume label (the boot menu finds the installer by it) and our art inside
          label() { xorriso -indev "$1" -pvd_info 2> /dev/null | awk -F': ' '/^Volume Id/ { print $2 }'; }
          [ "$(label "${ISO}")" = "$(label "${WORK}/branded.iso")" ]
          xorriso -osirrox on -indev "${WORK}/branded.iso" -extract /images/install.img "${WORK}/check.img" 2> /dev/null
          unsquashfs -l "${WORK}/check.img" > /dev/null

          mv "${WORK}/branded.iso" "${ISO}"
          sudo rm -rf "${WORK}"
          ls -lh "${ISO}"

      - name: Report unbranded installer
        if: steps.brand.outcome == 'failure'
        run: echo "::warning title=Installer branding skipped::Branding the installer failed; this ISO has the default Fedora artwork. See the Brand the installer step."

      - name: Upload disk images to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
