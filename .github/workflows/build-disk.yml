---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  # ISO-only changes rebuild the ISO from the current image
  push:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-disk.yml'
  # Rebuild the ISO after an image build caused by a push (not the daily scheduled ones)
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: "houssamos" # keep in sync with IMAGE_NAME in image-template.env
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # amd64 unless arm64 is picked by hand (push-triggered runs have no inputs)
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${{ matrix.disk-type }}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs bootc-image-builder directly (the bootc-image-builder-action is deprecated).
      # Job logs need a signed-in owner to read, so failures are also copied into a
      # public annotation and the run summary.
      - name: Build disk images
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          CONFIG="disk_config/disk.toml"
          if [ "${DISK_TYPE}" = "anaconda-iso" ]; then CONFIG="disk_config/iso.toml"; fi
          mkdir -p output

          # Same podman storage reset the bootc-image-builder-action did on GitHub runners
          # (https://github.com/osbuild/bootc-image-builder/issues/446)
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null

          sudo podman pull "${IMAGE}" 2>&1 | tail -n 3

          set +e
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v "$(pwd)/${CONFIG}:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type "${DISK_TYPE}" \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE}" 2>&1 | tee bib.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -ne 0 ]; then
            {
              echo '### bootc-image-builder failed'
              echo '```'
              tail -n 80 bib.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            msg=$(tail -n 40 bib.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=bootc-image-builder failed::${msg}"
            exit "${status}"
          fi

          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f -exec ls -lh {} \;
          echo "output-directory=$(pwd)/output" >> "${GITHUB_OUTPUT}"

      - name: Upload disk images to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: houssamos-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
