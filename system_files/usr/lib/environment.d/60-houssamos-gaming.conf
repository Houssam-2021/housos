# HoussamOS: bigger shader caches, so games don't stutter recompiling shaders they compiled before.
# NVIDIA's and Mesa's drivers keep 1 GB by default and throw away the oldest shaders beyond that,
# which a few big games fill on their own; 10 GB keeps them.
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
MESA_SHADER_CACHE_MAX_SIZE=10G
