<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="clip_lutris">
      <path d="M 128,22 C 198,22 234,58 234,128 C 234,198 198,234 128,234 C 58,234 22,198 22,128 C 22,58 58,22 128,22 Z"/>
    </clipPath>

    <linearGradient id="bg_lutris" x1="16%" y1="6%" x2="84%" y2="94%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#FB8500" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#B53800" stop-opacity="0.99"/>
    </linearGradient>

    <radialGradient id="top_light_lutris" cx="26%" cy="14%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="caustic_lutris" cx="68%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#FFE169" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FFE169" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFE169" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim_outer_lutris" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#E0F2FE" stop-opacity="0.58"/>
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFE169" stop-opacity="0.80"/>
    </linearGradient>

    <linearGradient id="rim_inner_lutris" x1="85%" y1="92%" x2="15%" y2="8%">
      <stop offset="0%" stop-color="#FFE169" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>

    <linearGradient id="glass_white_lutris" x1="22%" y1="10%" x2="78%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="58%" stop-color="#F1F5F9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="glass_sub_lutris" x1="20%" y1="10%" x2="80%" y2="92%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.52"/>
    </linearGradient>

    <filter id="bevel3d_lutris" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.40" result="drop1"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.26" in="SourceGraphic" result="drop2"/>
      <feMerge result="shadows">
        <feMergeNode in="drop1"/>
        <feMergeNode in="drop2"/>
      </feMerge>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur_alpha"/>
      <feSpecularLighting in="blur_alpha" surfaceScale="5" specularConstant="0.95" specularExponent="28" lighting-color="#FFFFFF" result="spec_raw">
        <fePointLight x="68" y="42" z="165"/>
      </feSpecularLighting>
      <feComposite in="spec_raw" in2="SourceAlpha" operator="in" result="spec_masked"/>
      <feMerge>
        <feMergeNode in="shadows"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="spec_masked"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M 128,29 C 198,29 234,65 234,135 C 234,205 198,241 128,241 C 58,241 22,205 22,135 C 22,65 58,29 128,29 Z" fill="#020617" fill-opacity="0.28"/>
  <path d="M 128,22 C 198,22 234,58 234,128 C 234,198 198,234 128,234 C 58,234 22,198 22,128 C 22,58 58,22 128,22 Z" fill="url(#bg_lutris)"/>

  <g clip-path="url(#clip_lutris)">
    <circle cx="158" cy="222" r="128" fill="url(#caustic_lutris)"/>
    <circle cx="76" cy="48" r="142" fill="url(#top_light_lutris)"/>
    <path d="M 16,20 L 240,20 L 240,96 C 186,70 86,86 16,120 Z" fill="#FFFFFF" fill-opacity="0.10"/>
    <g filter="url(#bevel3d_lutris)">
      
  <path d="M 84,84 L 172,84 C 194,84 206,104 202,134 L 194,168 C 190,186 172,192 158,178 L 142,160 L 114,160 L 98,178 C 84,192 66,186 62,168 L 54,134 C 50,104 62,84 84,84 Z"
        fill="url(#glass_white_lutris)"/>
  <rect x="82" y="104" width="11" height="31" rx="4" fill="#D9530F"/>
  <rect x="72" y="114" width="31" height="11" rx="4" fill="#D9530F"/>
  <circle cx="168" cy="106" r="6" fill="#F59E0B"/>
  <circle cx="180" cy="118" r="6" fill="#EF4444"/>
  <circle cx="168" cy="130" r="6" fill="#10B981"/>
  <circle cx="156" cy="118" r="6" fill="#3B82F6"/>
  <circle cx="110" cy="142" r="10" fill="#B53800" fill-opacity="0.75"/>
  <circle cx="146" cy="142" r="10" fill="#B53800" fill-opacity="0.75"/>

    </g>
  </g>

  <path d="M 128,25 C 196,25 231,60 231,128 C 231,196 196,231 128,231 C 60,231 25,196 25,128 C 25,60 60,25 128,25 Z" fill="none" stroke="url(#rim_inner_lutris)" stroke-width="1.5"/>
  <path d="M 128,22 C 198,22 234,58 234,128 C 234,198 198,234 128,234 C 58,234 22,198 22,128 C 22,58 58,22 128,22 Z" fill="none" stroke="url(#rim_outer_lutris)" stroke-width="2.2"/>
</svg>
