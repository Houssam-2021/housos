    </clipPath>

    <linearGradient id="bg_firefox" x1="16%" y1="6%" x2="84%" y2="94%">
      <stop offset="0%" stop-color="#2E1760" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#180B38" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0A041C" stop-opacity="0.99"/>
    </linearGradient>

    <radialGradient id="top_light_firefox" cx="26%" cy="14%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="caustic_firefox" cx="68%" cy="92%" r="60%">
