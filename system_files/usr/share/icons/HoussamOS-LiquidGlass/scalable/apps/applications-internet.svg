  <path d="M 160,64 C 180,84 186,118 170,146 C 154,174 118,184 90,168 C 118,176 148,162 158,136 C 166,114 162,86 146,72 C 152,68 156,66 160,64 Z"
        fill="#FFF8D6" fill-opacity="0.65"/>

