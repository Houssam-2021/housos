  <path d="M 60,126 C 56,162 84,196 126,198 C 168,200 198,166 196,122 C 194,94 178,72 160,64 C 172,82 174,108 162,126 C 148,146 120,152 100,138 C 86,128 82,110 88,94 C 72,102 62,112 60,126 Z"
