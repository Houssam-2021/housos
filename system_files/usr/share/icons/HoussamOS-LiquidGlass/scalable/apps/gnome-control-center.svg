    </clipPath>

    <linearGradient id="bg_settings" x1="16%" y1="6%" x2="84%" y2="94%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#334155" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.99"/>
    </linearGradient>

    <radialGradient id="top_light_settings" cx="26%" cy="14%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
