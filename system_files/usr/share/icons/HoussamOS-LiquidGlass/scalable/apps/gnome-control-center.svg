  <circle cx="128" cy="128" r="40" fill="#1E293B" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="128" y1="88" x2="128" y2="128" stroke="url(#glass_sub_settings)" stroke-width="9" stroke-linecap="round"/>
