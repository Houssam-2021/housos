<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="clip_terminal">
      <path d="M 74,22 L 182,22 C 215,22 234,41 234,74 L 234,182 C 234,215 215,234 182,234 L 74,234 C 41,234 22,215 22,182 L 22,74 C 22,41 41,22 74,22 Z"/>
    </clipPath>

    <linearGradient id="bg_terminal" x1="16%" y1="6%" x2="84%" y2="94%">
      <stop offset="0%" stop-color="#33394B" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#1A1E29" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0.99"/>
    </linearGradient>

    <radialGradient id="top_light_terminal" cx="26%" cy="14%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="caustic_terminal" cx="68%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim_outer_terminal" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#E0F2FE" stop-opacity="0.58"/>
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.80"/>
    </linearGradient>

    <linearGradient id="rim_inner_terminal" x1="85%" y1="92%" x2="15%" y2="8%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>

    <linearGradient id="glass_white_terminal" x1="22%" y1="10%" x2="78%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="58%" stop-color="#F1F5F9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="glass_sub_terminal" x1="20%" y1="10%" x2="80%" y2="92%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.52"/>
    </linearGradient>

    <filter id="bevel3d_terminal" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.40" result="drop1"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.26" in="SourceGraphic" result="drop2"/>
      <feMerge result="shadows">
        <feMergeNode in="drop1"/>
        <feMergeNode in="drop2"/>
      </feMerge>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur_alpha"/>
      <feSpecularLighting in="blur_alpha" surfaceScale="5" specularConstant="0.95" specularExponent="28" lighting-color="#FFFFFF" result="spec_raw">
        <fePointLight x="68" y="42" z="165"/>
      </feSpecularLighting>
      <feComposite in="spec_raw" in2="SourceAlpha" operator="in" result="spec_masked"/>
      <feMerge>
        <feMergeNode in="shadows"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="spec_masked"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M 74,29 L 182,29 C 215,29 234,48 234,81 L 234,189 C 234,222 215,241 182,241 L 74,241 C 41,241 22,222 22,189 L 22,81 C 22,48 41,29 74,29 Z" fill="#020617" fill-opacity="0.28"/>
  <path d="M 74,22 L 182,22 C 215,22 234,41 234,74 L 234,182 C 234,215 215,234 182,234 L 74,234 C 41,234 22,215 22,182 L 22,74 C 22,41 41,22 74,22 Z" fill="url(#bg_terminal)"/>

  <g clip-path="url(#clip_terminal)">
    <circle cx="158" cy="222" r="128" fill="url(#caustic_terminal)"/>
    <circle cx="76" cy="48" r="142" fill="url(#top_light_terminal)"/>
    <path d="M 16,20 L 240,20 L 240,96 C 186,70 86,86 16,120 Z" fill="#FFFFFF" fill-opacity="0.10"/>
    <g filter="url(#bevel3d_terminal)">
      
  <rect x="46" y="52" width="164" height="152" rx="28" fill="#07090E" fill-opacity="0.72"
        stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.22"/>
  <circle cx="70" cy="74" r="5.5" fill="#FF5F56"/>
  <circle cx="88" cy="74" r="5.5" fill="#FFBD2E"/>
  <circle cx="106" cy="74" r="5.5" fill="#27C93F"/>
  <path d="M 74,108 L 112,136 L 74,164" fill="none" stroke="url(#glass_white_terminal)"
        stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="154" width="48" height="14" rx="7" fill="#38BDF8"/>

    </g>
  </g>

  <path d="M 75,25 L 181,25 C 212,25 231,44 231,75 L 231,181 C 231,212 212,231 181,231 L 75,231 C 44,231 25,212 25,181 L 25,75 C 25,44 44,25 75,25 Z" fill="none" stroke="url(#rim_inner_terminal)" stroke-width="1.5"/>
  <path d="M 74,22 L 182,22 C 215,22 234,41 234,74 L 234,182 C 234,215 215,234 182,234 L 74,234 C 41,234 22,215 22,182 L 22,74 C 22,41 41,22 74,22 Z" fill="none" stroke="url(#rim_outer_terminal)" stroke-width="2.2"/>
</svg>
